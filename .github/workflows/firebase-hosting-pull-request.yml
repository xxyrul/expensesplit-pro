name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Step 1: Install the Flutter SDK
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      # Step 2: Download your project dependencies
      - run: flutter pub get
      
      # Step 3: Build the app
      - run: flutter build web
      
      # Step 4: Deploy a Preview URL to Firebase
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EXPENSESPLIT_PRO_9E1C8 }}
          projectId: expensesplit-pro-9e1c8