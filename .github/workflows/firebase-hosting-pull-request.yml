# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Step 1: Install the Flutter SDK
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      # Step 2: Download your project dependencies
      - working-directory: admin_web
        run: flutter pub get
      
      # Step 3: Build the app
      - working-directory: admin_web
        run: flutter build web
      
      # Step 4: Deploy a Preview URL to Firebase using Firebase CLI and service account credentials
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Configure Firebase service account credentials
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy preview to Firebase Hosting
        run: |
          firebase hosting:channel:deploy pr-${{ github.event.number }} --project expensesplit-pro-9e1c8