name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Step 1: Install the Flutter SDK
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      # Step 2: Download your project dependencies
      - working-directory: admin_web
        run: flutter pub get
      
      # Step 3: Build the app
      - working-directory: admin_web
        run: flutter build web
      
      # Step 4: Deploy a Preview URL to Firebase using the Firebase CLI and a CI token
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy preview to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase hosting:channel:deploy pr-${{ github.event.number }} --project expensesplit-pro-9e1c8