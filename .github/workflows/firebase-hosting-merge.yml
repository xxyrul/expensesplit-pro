# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
    paths:
      - 'admin_web/**'
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Step 1: Install the Flutter SDK
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      # Step 2: Download your project dependencies
      - working-directory: admin_web
        run: flutter pub get
      
      # Step 3: Build the app
      - working-directory: admin_web
        run: flutter build web --no-wasm-dry-run
      
      # Step 4: Deploy to Firebase using the Firebase CLI and a CI token
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > serviceAccount.json
          export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/serviceAccount.json"
          firebase deploy --only hosting --project expensesplit-pro-9e1c8
          rm -f serviceAccount.json