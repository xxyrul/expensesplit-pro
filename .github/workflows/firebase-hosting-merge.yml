name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Step 1: Install the Flutter SDK
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      # Step 2: Download your project dependencies
      - working-directory: admin_web
        run: flutter pub get
      
      # Step 3: Build the app
      - working-directory: admin_web
        run: flutter build web
      
      # Step 4: Deploy to Firebase
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EXPENSESPLIT_PRO_9E1C8 }}
          channelId: live
          projectId: expensesplit-pro-9e1c8