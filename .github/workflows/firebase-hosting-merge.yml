# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
    paths:
      - 'admin_web/**'
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Step 1: Install the Flutter SDK
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      # Step 2: Download your project dependencies
      - working-directory: admin_web
        run: flutter pub get
      
      # Step 3: Build the app
      - working-directory: admin_web
        run: flutter build web --no-wasm-dry-run
      
      # Step 4: Deploy to Firebase using Firebase CLI and service account credentials
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Configure Firebase service account credentials
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy to Firebase Hosting
        run: |
          firebase deploy --only hosting --project expensesplit-pro-9e1c8