name: Build & Deploy Admin Web

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (admin_web)
        working-directory: admin_web
        run: flutter pub get

      - name: Build admin_web (with optional dart-defines)
        working-directory: admin_web
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        run: |
          DF_FLAGS=( )
          if [[ -n "$FIREBASE_API_KEY" ]]; then DF_FLAGS+=("--dart-define=FIREBASE_API_KEY=$FIREBASE_API_KEY"); fi
          if [[ -n "$FIREBASE_APP_ID" ]]; then DF_FLAGS+=("--dart-define=FIREBASE_APP_ID=$FIREBASE_APP_ID"); fi
          if [[ -n "$FIREBASE_MESSAGING_SENDER_ID" ]]; then DF_FLAGS+=("--dart-define=FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID"); fi
          if [[ -n "$FIREBASE_PROJECT_ID" ]]; then DF_FLAGS+=("--dart-define=FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"); fi
          if [[ -n "$FIREBASE_AUTH_DOMAIN" ]]; then DF_FLAGS+=("--dart-define=FIREBASE_AUTH_DOMAIN=$FIREBASE_AUTH_DOMAIN"); fi
          if [[ -n "$FIREBASE_STORAGE_BUCKET" ]]; then DF_FLAGS+=("--dart-define=FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET"); fi
          flutter build web --release -t lib/main.dart "${DF_FLAGS[@]}"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then echo "FIREBASE_TOKEN secret is required"; exit 1; fi
          if [ -n "$FIREBASE_PROJECT" ]; then firebase deploy --only hosting --project "$FIREBASE_PROJECT" --token "$FIREBASE_TOKEN"; else firebase deploy --only hosting --token "$FIREBASE_TOKEN"; fi
