name: Build and deploy admin_web to Firebase Hosting

on:
  push:
    branches: [ main ]
    paths:
      - 'admin_web/**'
      - 'firebase.json'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Node.js (for Firebase CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Flutter dependencies (admin_web)
        run: |
          cd admin_web
          flutter pub get

      - name: Build Flutter web (admin_web)
        run: |
          cd admin_web
          flutter build web --release

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > serviceAccount.json
          export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/serviceAccount.json"
          firebase deploy --only hosting --project expensesplit-pro-9e1c8
          rm -f serviceAccount.json
