name: Build and deploy admin_web to Firebase Hosting

on:
  push:
    branches: [ main ]
    paths:
      - 'admin_web/**'
      - 'firebase.json'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Install Node.js (for Firebase CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Flutter dependencies (admin_web)
        run: |
          cd admin_web
          flutter pub get

      - name: Build Flutter web (admin_web)
        run: |
          cd admin_web
          flutter build web --release --web-renderer html

      - name: Configure Firebase service account credentials
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy to Firebase Hosting
        run: |
          # deploy uses the firebase.json at repository root which points
          # hosting.public to admin_web/build/web
          firebase deploy --only hosting
